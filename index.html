<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Báo cáo trực ca">
<meta name="theme-color" content="#d97706">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>Báo cáo trực ca Tuần hoàn - Clo</title>
<style>
:root{
  --blue:#d97706; --blue2:#f59e0b; --bg:#fff9f1; --card:#fff;
  --text:#152033; --muted:#65758b; --line:#dfe6ef; --ok:#16794c;
  --warn:#9a5b00; --danger:#a51d2d; --soft:#fff3e0;
}
*{box-sizing:border-box}
html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{height:42px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;letter-spacing:0.02em;position:sticky;top:0;z-index:30;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.app{max-width:980px;margin:0 auto;padding:8px 10px 80px}
.tabs{display:flex;gap:6px;overflow:auto;padding:6px 0 8px;position:sticky;top:42px;background:var(--bg);z-index:20}
.tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:10px;padding:8px 12px;font-weight:700;color:#334155;min-height:40px;font-size:14px}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(15,23,42,.03)}
.card-title{font-size:16px;font-weight:800;margin:0 0 11px}
.section-label{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
label.field{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--text);min-height:44px;padding:9px 10px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(217,119,6,.15)}
textarea{min-height:105px;resize:vertical;line-height:1.45}
.metric{margin-top:10px}
.head4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted);margin:0 0 4px}
.num4 input{text-align:center;padding-left:2px;padding-right:2px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.choice{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:white;border-radius:10px;padding:7px 10px;min-height:42px;font-weight:700;color:#334155}
.choice input{width:18px;height:18px;min-height:18px;margin:0}
.btn{border:1px solid var(--line);background:white;border-radius:10px;min-height:42px;padding:8px 10px;font-weight:800;color:#334155;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--blue);border-color:var(--blue);color:white}
.btn.success{background:#16794c;border-color:#16794c;color:white}
.btn.soft{background:var(--soft);border-color:#fed7aa;color:var(--blue)}
.btn.danger{color:var(--danger)}
.status{font-size:13px;margin-top:8px;color:var(--ok);font-weight:700}
.hidden{display:none!important}
.report{min-height:500px;font-family:inherit;line-height:1.5}
.quickbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-reset-span{grid-column:1/-1}
@media(max-width:640px){
 .app{padding:6px 8px 70px}
 .grid2,.grid3{grid-template-columns:1fr}
 .grid4{gap:4px}
 .num4 input{font-size:14px;padding:8px 1px}
 .card{padding:12px}
 .btn{font-size:13.5px}
}
</style>
</head>
<body>
<header class="topbar">Báo cáo trực ca Tuần hoàn – Clo</header>

<main class="app" id="app">
  <div class="tabs">
    <button class="tab active" type="button" data-tab="general">Thông tin</button>
    <button class="tab" type="button" data-tab="receive">Nhận ca</button>
    <button class="tab" type="button" data-tab="during">Trong ca</button>
    <button class="tab" type="button" data-tab="handover">Giao ca</button>
    <button class="tab" type="button" data-tab="report">Báo cáo</button>
  </div>

  <section data-page="general">
    <div class="card">
      <h2 class="card-title">Thông tin ca trực</h2>
      <div class="grid2">
        <div><label class="field">Ngày trực</label><input id="workDate" type="date"></div>
        <div><label class="field">Kíp trực</label>
          <select id="kip">
            <option value="A">Kíp A</option><option value="B" selected>Kíp B</option>
            <option value="C">Kíp C</option><option value="D">Kíp D</option><option value="E">Kíp E</option>
          </select>
        </div>
        <div><label class="field">Loại ca</label>
          <select id="shift">
            <option value="Sáng|07h00-15h00">Sáng · 07h00–15h00</option>
            <option value="Chiều|15h00-23h00">Chiều · 15h00–23h00</option>
            <option value="Khuya|23h00-07h00">Khuya · 23h00–07h00</option>
          </select>
        </div>
        <div><label class="field">Thời gian</label><input id="shiftTime" readonly></div>
      </div>
      <div class="metric">
        <label class="field">1. Nhân sự</label>
        <input id="staff">
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">3. Bất thường ca trước / Thao tác ca trước</h2>
      <textarea id="previousAbnormal" placeholder="Mỗi nội dung một dòng."></textarea>
    </div>

    <div class="card">
      <h2 class="card-title">4. Tồn tại / Bất thường tồn đọng</h2>
      <textarea id="issues" placeholder="Mỗi tồn tại một dòng."></textarea>
    </div>
  </section>

  <section data-page="receive" class="hidden">
    <div id="receiveMount"></div>
  </section>

  <section data-page="during" class="hidden">
    <div class="card">
      <h2 class="card-title">II. Trong ca</h2>
      <textarea id="duringText">VHV kiểm tra định kỳ thiết bị làm việc bình thường.</textarea>
    </div>
  </section>

  <section data-page="handover" class="hidden">
    <div class="quickbar">
      <button class="btn soft" type="button" id="cloneReceive">Lấy Nhận ca → Giao ca</button>
    </div>
    <div id="handoverMount"></div>

    <div class="card">
      <h2 class="card-title">IV. Bất thường, khiếm khuyết, lưu ý</h2>
      <textarea id="finalIssues" placeholder="Mỗi nội dung một dòng."></textarea>
    </div>

    <div class="card">
      <h2 class="card-title">Người giao / nhận ca</h2>
      <div class="grid2">
        <div>
          <label class="field">Giao ca</label>
          <input id="handoverPeople">
        </div>
        <div>
          <label class="field">Kíp nhận ca</label>
          <select id="receiveKip">
            <option value="">-- Chọn kíp --</option>
            <option value="A">Kíp A</option><option value="B">Kíp B</option>
            <option value="C">Kíp C</option><option value="D">Kíp D</option><option value="E">Kíp E</option>
          </select>
        </div>
        <div style="grid-column:1/-1">
          <label class="field">Nhận ca</label>
          <input id="receivePeople" placeholder="Chọn Kíp nhận ca để tự điền">
        </div>
      </div>
    </div>
  </section>

  <section data-page="report" class="hidden">
    <div class="card">
      <h2 class="card-title" style="margin:0 0 10px" id="reportTitle">Báo cáo hoàn chỉnh</h2>
      <textarea id="reportText" class="report" readonly></textarea>
      
      <div class="report-actions">
        <button class="btn primary" type="button" id="copyMailReport">Chép gửi Mail</button>
        <button class="btn success" type="button" id="copyGroupReport">Chép gửi Group</button>
        <button class="btn danger btn-reset-span" type="button" id="newShift">Bắt đầu ca mới</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </section>
</main>

<script>
(() => {
const app = document.getElementById('app');
const roster = {
  A:["Nguyễn Thành Trung","Đào Ngọc Văn"],
  B:["Nguyễn Văn Tuấn","Cao Niên Hà"],
  C:["Lê Hải Phong","Đinh Hoàng Giang"],
  D:["Nguyễn Hữu Sỹ","Nguyễn Duy Cường"],
  E:["Phạm Tiến Sỹ","Trịnh Dương Thọ"]
};
const U = ["1A","1B","2A","2B"];
const STORE_KEY = "qt_shift_report_v1";

let isResetting = false;

const $ = (s, el=app) => el.querySelector(s);
const $$ = (s, el=app) => [...el.querySelectorAll(s)];

function phaseHTML(title){
return `
<div class="card phase">
  <h2 class="card-title">${title}</h2>

  <div class="metric">
    <label class="field">Hệ thống bơm tuần hoàn</label>
    <div class="checks">${U.map(u=>`<label class="choice"><input type="checkbox" data-f="cwp" value="${u}">CWP ${u}</label>`).join("")}</div>
  </div>

  <div class="metric">
    <label class="field">Mức nước đầu kênh 1A/1B/2A/2B (m)</label>
    <div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div>
    <div class="grid4 num4">${U.map(()=>`<input inputmode="decimal" data-decimal data-f="level" placeholder="">`).join("")}</div>
  </div>

  <div class="section-label">Lưới chắn rác</div>
  <div class="grid3">
    <div><label class="field">Lưới quay</label>
      <select data-f="screen"><option value="stop">Đang dừng</option><option value="run">Đang chạy</option></select>
    </div>
    <div><label class="field">Bơm rửa lưới</label>
      <select data-f="washState"><option value="stop">Dừng / Không hoạt động</option><option value="run">Đang hoạt động</option></select>
    </div>
    <div><label class="field">Máy cào rác</label>
      <select data-f="rake"><option>Không hoạt động</option><option>Đang hoạt động</option></select>
    </div>
  </div>

  <div class="metric hidden" data-screen-units>
    <label class="field">Lưới quay đang chạy</label>
    <div class="checks">${U.map(u=>`<label class="choice"><input type="checkbox" data-f="screenUnit" value="${u}">${u}</label>`).join("")}</div>
  </div>

  <div class="metric hidden" data-wash-details style="background:var(--soft);padding:10px;border-radius:10px;border:1px dashed var(--line);margin-top:10px">
    <div class="grid2">
      <div>
        <label class="field">Bơm rửa lưới đang chạy</label>
        <div class="checks">
          <label class="choice"><input type="checkbox" data-f="washPump" value="A">Bơm A</label>
          <label class="choice"><input type="checkbox" data-f="washPump" value="B">Bơm B</label>
        </div>
      </div>
      <div>
        <label class="field">Áp suất bơm rửa lưới (MPa)</label>
        <input inputmode="decimal" data-decimal data-f="washPressure" placeholder="Ví dụ: 0.25">
      </div>
    </div>
  </div>

  <div class="section-label">Bơm tuần hoàn & CNRV</div>
  <div class="metric">
    <label class="field">Áp suất đầu đẩy bơm tuần hoàn 1A/1B/2A/2B (MPa)</label>
    <div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div>
    <div class="grid4 num4">${U.map(()=>`<input inputmode="decimal" data-decimal data-f="dis" placeholder="">`).join("")}</div>
  </div>
  <div class="metric">
    <label class="field">Áp suất dầu thủy lực van CNRV 1A/1B/2A/2B (MPa)</label>
    <div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div>
    <div class="grid4 num4">${U.map(()=>`<input inputmode="decimal" data-decimal data-f="hp" placeholder="">`).join("")}</div>
  </div>
  <div class="metric">
    <label class="field">Nhiệt độ dầu thủy lực van CNRV 1A/1B/2A/2B (°C)</label>
    <div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div>
    <div class="grid4 num4">${U.map(()=>`<input inputmode="decimal" data-decimal data-f="temp" placeholder="">`).join("")}</div>
  </div>
  <div class="metric">
    <label class="field">Mức dầu hệ thống thủy lực van CNRV 1A/1B/2A/2B (Lít)</label>
    <div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div>
    <div class="grid4 num4">${U.map(()=>`<input inputmode="decimal" data-decimal data-f="oil" placeholder="">`).join("")}</div>
  </div>
  <div class="metric">
    <label class="field">Bơm dầu thủy lực van CNRV 1A/1B/2A/2B</label>
    <div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div>
    <div class="grid4">${U.map(()=>`<select data-f="oilPump"><option>A</option><option>B</option></select>`).join("")}</div>
  </div>

  <div class="section-label">Hệ thống nhà clo</div>
  <div class="grid2">
    <div><label class="field">Hệ thống nhà clo</label><select data-f="chlorineState"><option>Đang chạy</option><option>Dừng</option></select></div>
    <div><label class="field">Clo cấp nhánh</label><select data-f="chlorineSupply"><option value="">-- Chọn --</option><option>A</option><option>B</option></select></div>
    <div><label class="field">Bộ định lượng</label><div class="checks">${["A","B","C","D"].map(x=>`<label class="choice"><input type="checkbox" data-f="meter" value="${x}">${x}</label>`).join("")}</div></div>
    <div><label class="field">Xả xuống kênh</label><div class="checks">${U.map(x=>`<label class="choice"><input type="checkbox" data-f="channel" value="${x}">${x}</label>`).join("")}</div></div>
    <div><label class="field">Bơm tăng áp nước biển</label><div class="checks">${["A","B","C","D","Không hoạt động"].map(x=>`<label class="choice"><input type="checkbox" data-f="booster" value="${x}">${x}</label>`).join("")}</div></div>
  </div>

  <div class="metric">
    <div class="grid2">
      <div><label class="field">Tổng số bình Clo</label><input inputmode="numeric" data-f="totalCylinder" placeholder="Tổng số bình"></div>
      <div><label class="field">Tổng số bình Clo khả dụng</label><input inputmode="numeric" data-f="remainingCylinder" placeholder="Số bình khả dụng"></div>
    </div>
  </div>

  <div class="metric">
    <label class="field">Nồng độ châm clo 1A/1B/2A/2B (ppm)</label>
    <div class="head4">${U.map(u=>`<span>${u}</span>`).join("")}</div>
    <div class="grid4 num4">${U.map(()=>`<input inputmode="decimal" data-decimal data-f="ppm" placeholder="">`).join("")}</div>
  </div>

  <div class="grid2 metric">
    <div><label class="field">Hệ thống trung hòa clo</label><select data-f="neutral"><option>Dừng / Không hoạt động</option><option>Đang chạy</option></select></div>
    <div><label class="field">Khối lượng NaOH trong bể chứa</label><input inputmode="text" data-f="naoh" placeholder="Ví dụ: 1590 mm hoặc 1.590m"></div>
    <div><label class="field">Hệ thống bơm nước hồi</label><select data-f="returnPump"><option>Ngừng</option><option>Đang chạy</option></select></div>
    <div><label class="field">Mức nước bể hồi A/B</label><div class="grid2"><input inputmode="text" data-f="tankA" placeholder="Bể A (m hoặc mm)"><input inputmode="text" data-f="tankB" placeholder="Bể B (m hoặc mm)"></div></div>
  </div>
</div>`;
}

$("#receiveMount").innerHTML = phaseHTML("2. Tình trạng thiết bị đầu ca");
$("#handoverMount").innerHTML = phaseHTML("III. Giao ca");

const receivePhase = $("#receiveMount .phase");
const handoverPhase = $("#handoverMount .phase");
let handoverInitialized=false;

function normalizeDotDecimal(v){
  let s = String(v ?? "").trim().replace(/,/g,".").replace(/[^0-9.\-]/g,"");
  const first = s.indexOf(".");
  if(first !== -1) s = s.slice(0,first+1) + s.slice(first+1).replace(/\./g,"");
  return s;
}
function vals(box,f){return $$(`[data-f="${f}"]`,box).map(e=>normalizeDotDecimal(e.value))}
function val(box,f){const e=$(`[data-f="${f}"]`,box);return e ? e.value.trim().replace(/,/g,".") : ""}
function checked(box,f){return $$(`input[data-f="${f}"]:checked`,box).map(e=>e.value)}

function setupDynamicPhaseEvents(box){
  const screenState=$('[data-f="screen"]',box), screenUnits=$('[data-screen-units]',box);
  screenState.addEventListener("change",()=>screenUnits.classList.toggle("hidden",screenState.value!=="run"));

  const washState=$('[data-f="washState"]',box), washDetails=$('[data-wash-details]',box);
  washState.addEventListener("change",()=>washDetails.classList.toggle("hidden",washState.value!=="run"));
}
setupDynamicPhaseEvents(receivePhase);
setupDynamicPhaseEvents(handoverPhase);

function setCurrentDateIfEmpty(){
  if($("#workDate").value) return;
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  $("#workDate").value=`${y}-${m}-${day}`;
}
function syncShift(){ $("#shiftTime").value=$("#shift").value.split("|")[1] }
function syncRoster(force=false){
  const currentKip = $("#kip").value;
  const people = (roster[currentKip] || []).join(", ");
  if(force || !$("#staff").value.trim()) $("#staff").value = people;
  if(force || !$("#handoverPeople").value.trim()) $("#handoverPeople").value = people;
}
function syncReceiveRoster(){
  const k=$("#receiveKip").value;
  if(k) $("#receivePeople").value=roster[k].join(", ") + ` ( Kíp ${k})`;
}

$("#shift").addEventListener("change",()=>{syncShift();saveDraft()});
$("#kip").addEventListener("change",()=>{syncRoster(true);saveDraft()});
$("#receiveKip").addEventListener("change",()=>{syncReceiveRoster();saveDraft()});

$$(".phase").forEach(box=>{
  $$('[data-decimal]',box).forEach(el=>{
    el.addEventListener("change",()=>{el.value=normalizeDotDecimal(el.value);saveDraft()});
  });
});

function clonePhase(){
  const src=$$("input,select",receivePhase), dst=$$("input,select",handoverPhase);
  src.forEach((s,i)=>{
    const d=dst[i]; if(!d) return;
    if(s.type==="checkbox") d.checked=s.checked; else d.value=s.value;
    d.dispatchEvent(new Event("change",{bubbles:true}));
  });
  $("#finalIssues").value = $("#issues").value;
  saveDraft();
}
$("#cloneReceive").addEventListener("click",clonePhase);

function bullets(text, compact=false){
  const arr=String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const sep = compact ? "\n" : "\n\n";
  return arr.map(x=>"- "+x.replace(/^[-•]\s*/,"")).join(sep);
}
function vnDate(s){
  const a=String(s||"").split("-");
  return a.length===3 ? `${a[2]}/${a[1]}/${a[0]}` : s;
}
function chlorineDetail(p){
  const meter=checked(p,"meter");
  const channel=checked(p,"channel");
  const supply=val(p,"chlorineSupply");
  const parts=[];
  if(supply) parts.push(`đang chạy clo nhánh cấp ${supply}`);
  if(meter.length) parts.push(`qua bộ định lượng ${meter.join(", ")}`);
  if(channel.length) parts.push(`xả châm liên tục xuống kênh ${channel.join(", ")}`);
  return parts.join(" ");
}
function boosterText(p){
  const a=checked(p,"booster");
  if(!a.length) return "";
  if(a.includes("Không hoạt động")) return "Không hoạt động";
  return `đang chạy bơm ${a.join(", ")}`;
}
function washText(p){
  const st=val(p,"washState");
  if(st!=="run") return "dừng";
  const pumps=checked(p,"washPump");
  const press=val(p,"washPressure");
  let res="Đang hoạt động";
  if(pumps.length) res+=` bơm ${pumps.join(", ")}`;
  if(press) res+=`, áp suất: ${press} MPa`;
  return res;
}
function phaseText(p, isGroup=false){
  const cwp=checked(p,"cwp");
  const screenState=val(p,"screen");
  const screenUnits=checked(p,"screenUnit");
  const screen=screenState==="run"
    ? `đang chạy lưới quay${screenUnits.length ? " "+screenUnits.join(", ") : ""}`
    : "đang dừng";
  const chlorineState=val(p,"chlorineState");
  const chlorine=chlorineDetail(p);
  const tankA=val(p,"tankA")||"0";
  const tankB=val(p,"tankB")||"0";
  const totalCyl = val(p,"totalCylinder");
  const remainCyl = val(p,"remainingCylinder");

  let cwpStr = cwp.length ? `chạy bơm tuần hoàn ${cwp.map(x=>"CWP "+x).join(", ")}` : "Đang dừng";
  let cwpDis = vals(p,"dis").filter(Boolean).join("/") || "";
  if(cwpDis && !cwpDis.toLowerCase().includes("mpa")) cwpDis += " MPa";

  const lines = [
`- Hệ thống bơm tuần hoàn: ${cwpStr}`,
`- Mức nước đầu kênh 1A/1B/2A/2B: ${vals(p,"level").join("/")}m`,
`- Tình trạng hoạt động của lưới quay: ${screen}`,
`- Tình trạng hoạt động của bơm rửa lưới: ${washText(p)}`,
`- Tình trạng hoạt động của máy cào rác: ${val(p,"rake")}`,
`- Áp suất đầu đẩy bơm tuần hoàn 1A/1B/2A/2B: ${cwpDis}`,
`- Áp suất hệ thống dầu thủy lực van CNRV 1A/1B/2A/2B: ${vals(p,"hp").join("/")} MPa`,
`- Nhiệt độ dầu thủy lực van CNRV 1A/1B/2A/2B: ${vals(p,"temp").join("/")}`,
`- Mức dầu hệ thống thủy lực van CNRV 1A/1B/2A/2B: ${vals(p,"oil").join("/")} lít`,
`- Bơm dầu thủy lực van CNRV 1A/1B/2A/2B: Bơm ${$$('[data-f="oilPump"]',p).map(x=>x.value).join("/")}`,
`- Hệ thống nhà clo: ${chlorine || chlorineState}`,
`- Nồng độ châm clo tại kênh 1A/1B/2A/2B: ${vals(p,"ppm").join("/")}`,
`- Hệ thống trung hòa clo: ${val(p,"neutral")}`,
`- Khối lượng NaOH trong bể chứa: ${val(p,"naoh") ? val(p,"naoh") : ""}`,
`- Hệ thống bơm nước hồi: ${val(p,"returnPump")}`,
`- Mức bể nước thu hồi A/B: ${tankA}/${tankB}`,
`- Tổng số bình Clo: ${totalCyl}`,
`- Tổng số bình Clo khả dụng: ${remainCyl}`
  ];
  return lines.join(isGroup ? "\n" : "\n\n");
}

Kính báo cáo.

  const [shiftName]= $("#shift").value.split("|");

  const staff=$("#staff").value.trim();

  return `Báo cáo TC, TKLM, MT: Tình hình thiết bị vận hành HV Trạm tuần hoàn, clo - Trạm nước lắng , hồi (Kíp ${$("#kip").value}) đầu ca ${shiftName} ngày ${vnDate($("#workDate").value)} (từ ${$("#shiftTime").value}) như sau:
I. Nhận ca:
1. Nhân sự: ${staff}
2. Tình trạng thiết bị đầu ca:

4. Tình trạng bất thường tồn đọng của thiết bị:

async function copyText(text, msg){
  saveDraft();
  let ok=false;
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); ok=true; }
  }catch(e){}
  if(!ok){
    $("#reportText").value = text;
    $("#reportText").focus(); $("#reportText").select();
    try{ ok=document.execCommand("copy"); }catch(e){}
  }
  $("#status").textContent=ok ? msg : "Đã chọn toàn bộ nội dung — hãy chọn Copy.";
}

$("#copyMailReport").addEventListener("click",async()=>{
  const content = buildMailReport();
  $("#reportText").value = content;
  await copyText(content, "Đã sao chép nội dung gửi Email.");
});

$("#copyGroupReport").addEventListener("click",async()=>{
  const content = buildGroupReport();
  $("#reportText").value = content;
  await copyText(content, "Đã sao chép nội dung gửi Group.");
});

function syncBoosterChoices(box){
  const items=$$('input[data-f="booster"]',box);
  items.forEach(el=>el.addEventListener("change",()=>{
    if(el.value==="Không hoạt động" && el.checked){
      items.forEach(x=>{if(x!==el)x.checked=false});
    }else if(el.checked){
      const none=items.find(x=>x.value==="Không hoạt động");
      if(none) none.checked=false;
    }
  }));
}
syncBoosterChoices(receivePhase); syncBoosterChoices(handoverPhase);

$$(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  if(btn.dataset.tab==="handover" && !handoverInitialized){
    clonePhase();
    handoverInitialized=true;
    saveDraft();
  }
  $$(".tab").forEach(x=>x.classList.remove("active")); btn.classList.add("active");
  $$("[data-page]").forEach(p=>p.classList.toggle("hidden",p.dataset.page!==btn.dataset.tab));
  if(btn.dataset.tab==="report") $("#reportText").value = buildMailReport();
}));

function serializePhase(p){
  const obj={};
  $$("[data-f]",p).forEach((e)=>{
    const key=e.dataset.f;
    if(e.type==="checkbox"){
      if(!obj[key]) obj[key]=[];
      if(e.checked) obj[key].push(e.value);
    }else{
      if(obj[key]===undefined) obj[key]=e.value;
      else if(Array.isArray(obj[key])) obj[key].push(e.value);
      else obj[key]=[obj[key],e.value];
    }
  });
  return obj;
}
function restorePhase(p,obj={}){
  const groups={};
  $$("[data-f]",p).forEach(e=>(groups[e.dataset.f]??=[]).push(e));
  Object.entries(groups).forEach(([key,els])=>{
    if(!(key in obj)) return;
    if(els[0].type==="checkbox"){
      const arr=Array.isArray(obj[key])?obj[key]:[];
      els.forEach(e=>e.checked=arr.includes(e.value));
    }else{
      const v=obj[key];
      if(Array.isArray(v)) els.forEach((e,i)=>{if(v[i]!==undefined)e.value=v[i]});
      else if(els[0]) els[0].value=v;
    }
  });
}
function saveDraft(){
  if(isResetting) return;
  try{
    const data={
      workDate:$("#workDate").value, kip:$("#kip").value, shift:$("#shift").value,
      staff:$("#staff").value, previousAbnormal:$("#previousAbnormal").value,
      issues:$("#issues").value, duringText:$("#duringText").value,
      finalIssues:$("#finalIssues").value, handoverPeople:$("#handoverPeople").value,
      receiveKip:$("#receiveKip").value, receivePeople:$("#receivePeople").value,
      receive:serializePhase(receivePhase), handover:serializePhase(handoverPhase),
      handoverInitialized
    };
    localStorage.setItem(STORE_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadDraft(){
  try{
    const raw=localStorage.getItem(STORE_KEY); if(!raw) return false;
    const d=JSON.parse(raw);
    if(d.workDate) $("#workDate").value=d.workDate;
    if(d.kip) $("#kip").value=d.kip;
    if(d.shift) $("#shift").value=d.shift;
    $("#staff").value=d.staff||"";
    $("#previousAbnormal").value=d.previousAbnormal||"";
    $("#issues").value = d.issues || "";
    $("#duringText").value=d.duringText||"VHV kiểm tra định kỳ thiết bị làm việc bình thường.";
    $("#finalIssues").value=d.finalIssues||"";
    $("#handoverPeople").value=d.handoverPeople||"";
    $("#receiveKip").value=d.receiveKip||"";
    $("#receivePeople").value=d.receivePeople||"";
    restorePhase(receivePhase,d.receive); restorePhase(handoverPhase,d.handover);
    handoverInitialized = d.handoverInitialized===true || !!d.handover;
    return true;
  }catch(e){return false}
}

document.addEventListener("visibilitychange", () => {
  if (!isResetting && document.visibilityState === "hidden") saveDraft();
});
window.addEventListener("pagehide", () => {
  if (!isResetting) saveDraft();
});

$("#newShift").addEventListener("click",()=>{
  if(!confirm("Bắt đầu ca mới: Giữ nguyên mục 3, 4, II, IV và chỉ làm mới số liệu đo kiểm của ca?")) return;
  isResetting = true;
  const keepPrev = $("#previousAbnormal").value;
  const keepIssues = $("#issues").value;
  const keepDuring = $("#duringText").value;
  const keepFinal = $("#finalIssues").value;
  localStorage.removeItem(STORE_KEY);
  
  const tempSave = {
    previousAbnormal: keepPrev,
    issues: keepIssues,
    duringText: keepDuring,
    finalIssues: keepFinal
  };
  localStorage.setItem(STORE_KEY, JSON.stringify(tempSave));
  location.reload();
});

loadDraft();
setCurrentDateIfEmpty();
syncShift();
syncRoster(false);
})();
</script>
